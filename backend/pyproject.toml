[project]
name = "resume-roaster-backend"
version = "0.1.0"
description = "AI Resume Brutal Roaster — FastAPI backend"
authors = [{ name = "Resume Roaster" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.115,<0.116)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.29,<1.0)",
    "alembic (>=1.13,<2.0)",
    "pydantic[email] (>=2.9,<3.0)",
    "pydantic-settings (>=2.5,<3.0)",
    "litellm (>=1.40,<2.0)",
    "python-multipart (>=0.0.9)",
    "pdfplumber (>=0.11,<1.0)",
    "python-docx (>=1.1,<2.0)",
    "python-magic-bin (>=0.2) ; sys_platform == 'win32'",
    "pwdlib[bcrypt] (>=0.2,<1.0)",
    "pyjwt (>=2.8,<3.0)",
    "slowapi (>=0.1.9)",
    "redis (>=5.0,<6.0)",
    "arq (>=0.26,<1.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-mock = ">=3.12"
httpx = ">=0.27"
ruff = ">=0.5"
mypy = ">=1.10"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The alembic/ script directory shares its name with the installed package;
# it is Alembic's own code, never an app module.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Allow FastAPI's dependency injection defaults (standard FastAPI pattern)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: real-AI end-to-end tests (opt-in via RUN_INTEGRATION=1)",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
